[project]
name = "Investment-Research-Decision-agent"
version = "0.1.0"
description = "Investment Research and Decision Agent built with LangGraph"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "langchain-core",
    "pydantic>=2.0",
    "langchain-openai",
    "python-dotenv",
    "requests",
]

[project.optional-dependencies]
real-data = [
    "akshare",
    "baostock",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "langgraph",
    "langgraph-checkpoint-sqlite",
    "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]